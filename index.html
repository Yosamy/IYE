<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pasaporte Textil VR</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.8.0/dist/aframe-v1.8.0.min.js"></script>
  <script src="config.js"></script>
  <script src="juego.js"></script>
</head>
<body>
  <a-scene
    renderer="antialias: true"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .clickable; far: 8"
    background="color: #dfe7e4">

    <!-- Luces -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="1 3 2"></a-entity>

    <!-- Jugador: está de pie y no se desplaza -->
    <a-entity id="rig">
      <a-entity id="camara" camera look-controls="magicWindowTrackingEnabled: false" position="0 1.6 0"></a-entity>
      <a-entity id="mano-der" laser-controls="hand: right" raycaster="objects: .clickable; far: 8; lineColor: #2fe0a6; lineOpacity: 0.9"></a-entity>
      <a-entity id="mano-izq" laser-controls="hand: left" raycaster="objects: .clickable; far: 8; lineColor: #2fe0a6; lineOpacity: 0.9"></a-entity>
    </a-entity>

    <!-- Tienda -->
    <a-plane rotation="-90 0 0" width="12" height="12" color="#cfc8bd"></a-plane>
    <a-plane position="0 2 -4" width="12" height="4" color="#f4efe6"></a-plane>
    <a-plane position="-4 2 0" rotation="0 90 0" width="12" height="4" color="#ece6dc"></a-plane>
    <a-plane position="4 2 0" rotation="0 -90 0" width="12" height="4" color="#ece6dc"></a-plane>
    <a-entity id="percheros"></a-entity>

    <!-- Máquina recolectora -->
    <a-entity id="maquina" position="0 0 -2.1">
      <a-box position="0 1.05 0" width="1.3" height="2.1" depth="0.7" color="#1f5b4a"></a-box>
      <a-box position="0 2.15 0" width="1.4" height="0.12" depth="0.75" color="#163f34"></a-box>
      <a-entity id="letrero" position="0 2.42 0.05"></a-entity>
      <a-entity id="pantalla" position="0 1.62 0.36"></a-entity>
      <!-- Ranura -->
      <a-box position="0 0.98 0.351" width="0.7" height="0.24" depth="0.01" color="#2fe0a6"></a-box>
      <a-box id="ranura" class="clickable" position="0 0.98 0.36" width="0.62" height="0.16" depth="0.02" color="#0b1f1a"></a-box>
      <a-entity id="ranura-texto" position="0 1.16 0.36"></a-entity>
      <a-entity id="mensaje" position="0 1.62 0.38" visible="false"></a-entity>
    </a-entity>

    <!-- Mesón con el canasto -->
    <a-entity id="meson" position="0 0 -0.95">
      <a-box position="0 0.35 0" width="1.7" height="0.7" depth="0.6" color="#8a6a4a"></a-box>
      <a-entity id="canasto" position="0 0.7 0"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
